[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-agentic-os"
version = "0.1.0"
description = "Parallel independent Kimi Code CLI session orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
parallel-agents = "parallel_agentic_os.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_agentic_os"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
